name: Release
run-name: Release / latest - ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - '[vV][0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing image version to copy to latest (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/silevilence/videonote
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate changelog and extract release notes
        id: notes
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"

      - name: Build image
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" .

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: docker push "$IMAGE:$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  latest:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/silevilence/videonote
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - name: Validate existing image version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing image version such as 0.1.0.' >&2
            exit 1
          fi

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Copy existing manifest to latest and verify
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/source-manifest.json"
          docker buildx imagetools inspect --raw "$IMAGE:latest" > "$RUNNER_TEMP/latest-manifest.json"
          cmp "$RUNNER_TEMP/source-manifest.json" "$RUNNER_TEMP/latest-manifest.json"
